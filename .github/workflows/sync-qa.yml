name: Sync All 4 Salesforce Reports to Google Sheets

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync-all-reports:
    runs-on: ubuntu-latest
    env:
      SF_ORG_MAX_QUERY_LIMIT: "500000"
    steps:
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authorize Salesforce Org
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > authfile.txt
          sf org login sfdx-url --sfdx-url-file authfile.txt --alias my-org
          rm -f authfile.txt

      - name: Query Salesforce & Sync All 4 Google Sheets
        env:
          WEBHOOK_QA: ${{ secrets.GSHEET_WEBHOOK_URL }}
          WEBHOOK_LATENESS: ${{ secrets.GSHEET_WEBHOOK_LATENESS }}
          WEBHOOK_BREAKS: ${{ secrets.GSHEET_WEBHOOK_BREAKS }}
          WEBHOOK_SLA: ${{ secrets.GSHEET_WEBHOOK_SLA }}
          WEBHOOK_KEY: ${{ secrets.GSHEET_WEBHOOK_KEY }}
        run: |
          # 1. QA Report
          sf data query \
            --query "SELECT QMS_Agent_Full_Name__c, Name, QMS_Case_Number__r.CaseNumber, Rating__c, QMS_Total__c FROM QMS_Transaction__c WHERE QMS_Date_Of_Monitoring__c = THIS_MONTH AND QMS_Status__c != 'Draft' AND QMS_Agent_Manager__c IN ('Nada Metwaly', 'Rania Mohamed', 'Abdelrahman Mohamed', 'Nada Metwally', 'Mostafa Hamed', 'Mohamed Sayed') AND QMS_Agent_Full_Name__c NOT IN ('Ahmed Basiouny', 'Ahmed Ramadan', 'Hamada Elshenawy') ORDER BY QMS_Agent_Full_Name__c ASC" \
            --target-org my-org \
            --result-format csv > /tmp/qa_data.csv

          # 2. SF Lateness Report
          sf data query \
            --query "SELECT User.Name, StatusStartDate FROM UserServicePresence WHERE CreatedDate = THIS_MONTH AND User.Manager.Name IN ('Nada Metwaly', 'Rania Mohamed', 'Abdelrahman Mohamed', 'Nada Metwally', 'Mostafa Hamed', 'Mohamed Sayed') AND User.Name NOT IN ('Ahmed Basiouny', 'Ahmed Ramadan', 'Hamada Elshenawy', 'Mohamed Bekheit') ORDER BY User.Name ASC, StatusStartDate ASC" \
            --target-org my-org \
            --result-format csv > /tmp/lateness_data.csv

          # 3. Breaks Report
          sf data query \
            --query "SELECT User.Name, StatusStartDate, StatusEndDate FROM UserServicePresence WHERE CreatedDate = THIS_MONTH AND ServicePresenceStatus.DeveloperName = 'Break' AND User.Manager.Name IN ('Nada Metwaly', 'Rania Mohamed', 'Abdelrahman Mohamed', 'Nada Metwally', 'Mostafa Hamed', 'Mohamed Sayed') AND User.Name NOT IN ('Ahmed Basiouny', 'Ahmed Ramadan', 'Hamada Elshenawy', 'Mohamed Bekheit') ORDER BY User.Name ASC, StatusStartDate ASC" \
            --target-org my-org \
            --result-format csv > /tmp/breaks_data.csv

          # 4A. Fetch Team Agents strictly under your 6 Managers (excluding the 4 agents)
          sf data query \
            --query "SELECT Id, Name FROM User WHERE Manager.Name IN ('Nada Metwaly', 'Rania Mohamed', 'Abdelrahman Mohamed', 'Nada Metwally', 'Mostafa Hamed', 'Mohamed Sayed') AND Name NOT IN ('Ahmed Basiouny', 'Ahmed Ramadan', 'Hamada Elshenawy', 'Mohamed Bekheit')" \
            --target-org my-org \
            --result-format csv > /tmp/team_users.csv

          # 4B & 4C. Filter Cases server-side by Team User IDs, reconstruct exact Case Lifecycle SLA rows, and push all 4 sheets
          python3 -c '
          import csv, io, json, os, subprocess, urllib.request
          from datetime import datetime
          from collections import defaultdict

          team_names = set()
          team_ids = []
          with open("/tmp/team_users.csv", "r", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r.get("Name"):
                      team_names.add(r["Name"].strip())
                  if r.get("Id"):
                      team_ids.append(r["Id"].strip())

          id_list = ",".join(f"\x27{uid}\x27" for uid in team_ids)

          # Step 1: Query ONLY Cases owned by OR modified/created by your 6 Managers\x27 teams on Salesforce\x27s servers
          team_cases_soql = (
              "SELECT Id FROM Case "
              "WHERE CreatedDate = THIS_MONTH "
              "AND Status IN (\x27Canceled\x27, \x27Resolved\x27) "
              "AND ATG_Current_Queue_Name__c NOT IN (\x27FFT B2B - Reconciliation\x27, \x27FFT ALM - Manual Validation\x27) "
              f"AND (OwnerId IN ({id_list}) OR LastModifiedById IN ({id_list}) OR CreatedById IN ({id_list}))"
          )
          subprocess.run(
              ["sf", "data", "query", "--query", team_cases_soql, "--target-org", "my-org", "--result-format", "csv"],
              stdout=open("/tmp/team_cases.csv", "w", encoding="utf-8"),
              check=True
          )

          team_case_ids = set()
          with open("/tmp/team_cases.csv", "r", encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  if r.get("Id"):
                      team_case_ids.add(r["Id"].strip())

          # Step 2: Query full Status + Owner CaseHistory ONLY for those exact team CaseIds (in chunks of 500 IDs)
          all_case_ids = sorted(team_case_ids)
          cases = defaultdict(list)
          case_meta = {}

          for i in range(0, len(all_case_ids), 500):
              chunk = ",".join(f"\x27{cid}\x27" for cid in all_case_ids[i:i+500])
              chunk_soql = (
                  "SELECT CaseId, Case.CreatedDate, Case.Owner.Name, Case.Subject, Field, OldValue, NewValue, CreatedDate "
                  "FROM CaseHistory "
                  "WHERE Field IN (\x27Status\x27, \x27Owner\x27) "
                  f"AND CaseId IN ({chunk}) "
                  "ORDER BY CaseId ASC, CreatedDate ASC"
              )
              res = subprocess.run(
                  ["sf", "data", "query", "--query", chunk_soql, "--target-org", "my-org", "--result-format", "csv"],
                  capture_output=True, text=True, check=True
              )
              for r in csv.DictReader(io.StringIO(res.stdout)):
                  cid = r["CaseId"]
                  cases[cid].append(r)
                  if cid not in case_meta:
                      case_meta[cid] = (
                          r.get("Case.Owner.Name", ""),
                          r.get("Case.Subject", ""),
                          r.get("Case.CreatedDate", "")
                      )

          def parse_ts(ts_str):
              return datetime.strptime(ts_str.replace("+0000", "+00:00"), "%Y-%m-%dT%H:%M:%S.%f%z")

          sla_buf = io.StringIO()
          writer = csv.writer(sla_buf)
          writer.writerow(["Case History Owner", "Case Owner", "Subject", "Duration"])

          for cid, events in cases.items():
              final_owner, subject, case_created_str = case_meta[cid]
              case_created_ts = parse_ts(case_created_str)

              clean_events = []
              for ev in events:
                  if ev["Field"] == "Owner":
                      val = ev["NewValue"] or ev["OldValue"] or ""
                      if val.startswith(("005", "00G")) and len(val) in (15, 18):
                          continue
                  clean_events.append(ev)

              # Sort by timestamp, and at identical timestamps process Owner updates before Status changes
              clean_events.sort(key=lambda e: (e["CreatedDate"], 0 if e["Field"] == "Owner" else 1))

              # Determine initial owner & initial status at Case creation
              current_owner = final_owner
              for ev in clean_events:
                  if ev["Field"] == "Owner" and ev["OldValue"]:
                      current_owner = ev["OldValue"]
                      break

              initial_status = "New"
              for ev in clean_events:
                  if ev["Field"] == "Status" and ev["OldValue"]:
                      initial_status = ev["OldValue"]
                      break

              current_status = initial_status
              in_progress_start = case_created_ts if initial_status == "In Progress" else None
              seg_owner = current_owner

              for ev in clean_events:
                  ts = parse_ts(ev["CreatedDate"])
                  fld = ev["Field"]
                  new_v = ev["NewValue"] or ""

                  if fld == "Status":
                      if current_status == "In Progress" and in_progress_start is not None:
                          dur = round((ts - in_progress_start).total_seconds() / 60.0, 3)
                          if seg_owner in team_names:
                              writer.writerow([seg_owner, final_owner, subject, dur])
                          in_progress_start = None
                      current_status = new_v
                      if new_v == "In Progress":
                          in_progress_start = ts
                          seg_owner = current_owner
                  elif fld == "Owner":
                      if current_status == "In Progress" and in_progress_start is not None:
                          dur = round((ts - in_progress_start).total_seconds() / 60.0, 3)
                          if seg_owner in team_names:
                              writer.writerow([seg_owner, final_owner, subject, dur])
                          in_progress_start = ts
                      current_owner = new_v
                      seg_owner = current_owner

          sla_csv_text = sla_buf.getvalue()

          def post_csv(csv_text, webhook_url, label):
              payload = json.dumps({
                  "key": os.environ["WEBHOOK_KEY"],
                  "csv": csv_text
              }).encode("utf-8")
              req = urllib.request.Request(
                  webhook_url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  print(label, "->", resp.read().decode("utf-8"))

          for path, env_var, label in [
              ("/tmp/qa_data.csv", "WEBHOOK_QA", "QA"),
              ("/tmp/lateness_data.csv", "WEBHOOK_LATENESS", "Lateness"),
              ("/tmp/breaks_data.csv", "WEBHOOK_BREAKS", "Breaks"),
          ]:
              with open(path, "r", encoding="utf-8") as f:
                  post_csv(f.read(), os.environ[env_var], label)

          post_csv(sla_csv_text, os.environ["WEBHOOK_SLA"], "SLA")
          '

          rm -f /tmp/qa_data.csv /tmp/lateness_data.csv /tmp/breaks_data.csv /tmp/team_users.csv /tmp/team_cases.csv
